<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>The Locality Map</title><style>body{margin:0;padding:28px;background:#fff;}.map-figure{max-width:1200px;margin:0 auto;}/* The Locality Map — Sign Band world tokens and rules.
   The map is drawn in the dossier's own inks: paper ground, ink rules, one
   yellow accent for the selection. The three verdict colours are the only
   other colour on the sheet, and every mark repeats its verdict in shape so
   the map still reads without them. */

.map-figure {
  --map-ink: var(--ink, #111111);
  --map-ink-2: #3a3a36;
  --map-ink-3: #6e6a62;
  --map-ink-4: #76736d;
  --map-paper: var(--paper, #ffffff);
  --map-rule: var(--rule-soft, #cbc7be);
  --map-hair: var(--rule-hair, #dedbd4);
  --map-signal: var(--signal, #f2c200);
  --map-go: #17694a;
  --map-hold: #8a5a00;
  --map-nogo: #a02c24;

  margin: 28px 0 40px;
  font-family: var(--face, 'Public Sans', sans-serif);
}

.map-figure * {
  box-sizing: border-box;
}

/* --- The head: figure number, title and the hint --------------------------- */
.map-head {
  display: grid;
  grid-template-columns: auto 1fr;
  grid-template-areas: 'fig title' 'hint hint';
  align-items: baseline;
  gap: 4px 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--map-ink);
}

.map-head__fig {
  grid-area: fig;
  font-family: var(--face-data, 'Roboto Mono', monospace);
  font-size: 12px;
  letter-spacing: 0.08em;
  color: var(--map-ink);
}

.map-head__title {
  grid-area: title;
  font-family: var(--face-data, 'Roboto Mono', monospace);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  text-align: right;
  color: var(--map-ink-2);
}

.map-head__hint {
  grid-area: hint;
  font-family: var(--face-data, 'Roboto Mono', monospace);
  font-size: 10.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--map-ink-3);
}

/* --- The toolbar: four sliders and a count -------------------------------- */
.map-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 14px 28px;
  padding: 12px 0 14px;
  border-top: 1px solid var(--map-ink);
  border-bottom: 1px solid var(--map-hair);
}

.map-toolbar__sliders {
  display: flex;
  flex-wrap: wrap;
  gap: 12px 26px;
  flex: 1 1 auto;
  min-width: 0;
}

.map-slider {
  display: grid;
  grid-template-columns: auto 1fr;
  grid-template-areas: 'label value' 'range range';
  gap: 2px 8px;
  min-width: 168px;
  flex: 1 1 168px;
}

.map-slider__label {
  grid-area: label;
  font-family: var(--face-data, 'Roboto Mono', monospace);
  font-size: 10px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--map-ink-3);
  /* The label gives way before the number does: a number broken over two
     lines cannot be read at a glance, and the label can. */
  overflow-wrap: normal;
  word-break: keep-all;
}

.map-slider__value {
  grid-area: value;
  font-family: var(--face-data, 'Roboto Mono', monospace);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  color: var(--map-ink);
  text-align: right;
  white-space: nowrap;
}

.map-slider input[type='range'] {
  grid-area: range;
  width: 100%;
  height: 18px;
  margin: 0;
  background: transparent;
  -webkit-appearance: none;
  appearance: none;
  cursor: ew-resize;
}

.map-slider input[type='range']::-webkit-slider-runnable-track {
  height: 2px;
  background: var(--map-ink-4);
}

.map-slider input[type='range']::-moz-range-track {
  height: 2px;
  background: var(--map-ink-4);
}

.map-slider input[type='range']::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 16px;
  margin-top: -7px;
  border: 1px solid var(--map-ink);
  border-radius: 0;
  background: var(--map-paper);
}

.map-slider input[type='range']::-moz-range-thumb {
  width: 12px;
  height: 16px;
  border: 1px solid var(--map-ink);
  border-radius: 0;
  background: var(--map-paper);
}

.map-slider input[type='range']:focus-visible {
  outline: 2px solid var(--map-signal);
  outline-offset: 2px;
}

.map-toolbar__count {
  margin: 0;
  font-family: var(--face-data, 'Roboto Mono', monospace);
  font-size: 12px;
  color: var(--map-ink-2);
  white-space: nowrap;
}

/* --- The body: the sheet and the readout ---------------------------------- */
.map-body {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 316px;
  gap: 20px;
  align-items: start;
  margin-top: 16px;
}

.map-stage {
  position: relative;
  height: 620px;
  border: 1px solid var(--map-ink);
  background: var(--map-paper);
  overflow: hidden;
  touch-action: none;
}

.map-stage.is-panning {
  cursor: grabbing;
}

.map-canvas {
  position: relative;
  width: 100%;
  height: 100%;
}

.map-svg {
  display: block;
  width: 100%;
  height: 100%;
  cursor: grab;
}

/* --- The sheet ------------------------------------------------------------ */
/* The geography is drawn in metres, so its strokes are told to keep a screen
   width: without that a one-metre line is a hundredth of a pixel. */
.map-coast {
  fill: none;
  stroke: var(--map-ink);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.map-road {
  fill: none;
  stroke: var(--map-ink-3);
  stroke-width: 1.1;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.map-route {
  fill: none;
  stroke: var(--map-ink-2);
  stroke-width: 1;
  stroke-opacity: 0.22;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
  transition: stroke-opacity 160ms var(--ease, cubic-bezier(0.16, 0.84, 0.44, 1));
}

.map-route.is-active {
  stroke-opacity: 0.9;
  stroke-width: 2;
}

/* --- The marks ------------------------------------------------------------ */
.map-place {
  cursor: pointer;
}

.map-place__body {
  transform-box: fill-box;
  transform-origin: center;
  transition: transform 140ms var(--ease, cubic-bezier(0.16, 0.84, 0.44, 1));
}

.map-place.is-lifted .map-place__body {
  transform: translateY(-11px) scale(1.28);
}

.map-place__hit {
  fill: transparent;
  stroke: none;
}

.map-place:focus {
  outline: none;
}

.map-place:focus-visible .map-place__shape {
  stroke: var(--map-ink);
  stroke-width: 2.4;
}

.map-place__selection {
  fill: none;
  stroke: var(--map-signal);
  stroke-width: 2.4;
  pointer-events: none;
  opacity: 0;
}

.map-place.is-selected .map-place__selection {
  opacity: 1;
}

.map-place.is-dimmed {
  opacity: 0.16;
  pointer-events: none;
}

.map-place.is-clustered {
  display: none;
}

.map-label[hidden] {
  display: none;
}

.map-label text {
  font-family: var(--face, 'Public Sans', sans-serif);
  font-size: 12px;
  fill: var(--map-ink-2);
  paint-order: stroke;
  stroke: var(--map-paper);
  stroke-width: 3px;
  stroke-linejoin: round;
}

/* --- Clusters -------------------------------------------------------------- */
.map-cluster {
  cursor: pointer;
}

/* A cluster whose places do not all carry the same verdict is drawn as an
   open ring, not a black disc: a solid black blob on a paper sheet is the
   loudest thing on the page, and a mixed cluster is saying nothing about a
   verdict. It says only that places are here. */
.map-cluster__disc {
  fill: var(--map-paper);
  stroke: var(--map-ink);
  stroke-width: 1.6;
}

.map-cluster--go .map-cluster__disc { fill: var(--map-go); stroke: var(--map-go); }
.map-cluster--hold .map-cluster__disc { fill: var(--map-hold); stroke: var(--map-hold); }
.map-cluster--nogo .map-cluster__disc { fill: var(--map-nogo); stroke: var(--map-nogo); }

.map-cluster__count {
  font-family: var(--face-data, 'Roboto Mono', monospace);
  font-size: 11px;
  font-weight: 600;
  fill: var(--map-ink);
  text-anchor: middle;
}

.map-cluster--go .map-cluster__count,
.map-cluster--hold .map-cluster__count,
.map-cluster--nogo .map-cluster__count {
  fill: var(--map-paper);
}

.map-cluster:focus-visible .map-cluster__disc {
  stroke: var(--map-signal);
  stroke-width: 3;
}

/* --- Furniture -------------------------------------------------------------- */
.map-scale {
  position: absolute;
  left: 12px;
  bottom: 12px;
  z-index: 2;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  pointer-events: none;
}

.map-scale__bar {
  display: block;
  height: 7px;
  border: 1px solid var(--map-ink-2);
  border-top: none;
}

.map-scale__label {
  font-family: var(--face-data, 'Roboto Mono', monospace);
  font-size: 10px;
  color: var(--map-ink-2);
}

.map-north {
  position: absolute;
  right: 12px;
  top: 10px;
  z-index: 2;
  color: var(--map-ink-2);
  pointer-events: none;
}

.map-north text {
  font-family: var(--face-data, 'Roboto Mono', monospace);
}

/* --- The callout ------------------------------------------------------------ */
.map-callout {
  position: absolute;
  z-index: 3;
  display: grid;
  gap: 2px;
  max-width: 210px;
  padding: 7px 10px;
  background: var(--map-paper);
  border: 1px solid var(--map-ink);
  pointer-events: none;
}

.map-callout--flip {
  transform: translateX(-100%);
}

.map-callout__name {
  font-size: 13px;
  font-weight: 600;
  line-height: 1.2;
  color: var(--map-ink);
}

.map-callout__figures {
  font-family: var(--face-data, 'Roboto Mono', monospace);
  font-size: 10.5px;
  line-height: 1.35;
  color: var(--map-ink-2);
}

/* --- The zoom control -------------------------------------------------------- */
.map-zoom {
  position: absolute;
  right: 10px;
  bottom: 10px;
  z-index: 4;
  display: grid;
  gap: 4px;
}

.map-zoom button {
  min-width: 30px;
  height: 28px;
  padding: 0 7px;
  border: 1px solid var(--map-ink);
  border-radius: 0;
  background: var(--map-paper);
  color: var(--map-ink);
  font-family: var(--face-data, 'Roboto Mono', monospace);
  font-size: 12px;
  line-height: 1;
  cursor: pointer;
}

.map-zoom button:hover {
  background: var(--map-panel, #f6f5f1);
}

.map-zoom button:focus-visible {
  outline: 2px solid var(--map-signal);
  outline-offset: 1px;
}

/* --- The readout -------------------------------------------------------------- */
.map-readout {
  padding: 14px 16px 16px;
  border: 1px solid var(--map-ink);
  background: var(--map-paper);
}

.map-readout__eyebrow {
  margin: 0 0 4px;
  font-family: var(--face-data, 'Roboto Mono', monospace);
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--map-ink-3);
}

.map-readout__name {
  margin: 0 0 2px;
  font-size: 21px;
  line-height: 1.15;
  font-weight: 600;
  color: var(--map-ink);
}

.map-readout__where {
  margin: 0 0 12px;
  font-size: 12.5px;
  line-height: 1.35;
  color: var(--map-ink-3);
}

.map-readout__numbers {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px 14px;
  margin: 0 0 12px;
  padding: 12px 0 0;
  border-top: 1px solid var(--map-hair);
}

.map-readout__numbers div {
  min-width: 0;
}

.map-readout__numbers dt {
  font-family: var(--face-data, 'Roboto Mono', monospace);
  font-size: 9.5px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--map-ink-3);
}

.map-readout__numbers dd {
  margin: 2px 0 0;
  font-family: var(--face-data, 'Roboto Mono', monospace);
  font-size: 16px;
  font-variant-numeric: tabular-nums;
  color: var(--map-ink);
}

.map-readout__reason {
  margin: 0;
  padding-top: 10px;
  border-top: 1px solid var(--map-hair);
  font-size: 13px;
  line-height: 1.45;
  color: var(--map-ink-2);
}

.map-readout[data-verdict='GO'] .map-readout__numbers dd { color: var(--map-go); }
.map-readout[data-verdict='HOLD'] .map-readout__numbers dd { color: var(--map-hold); }
.map-readout[data-verdict='NO-GO'] .map-readout__numbers dd { color: var(--map-nogo); }

/* --- The legend ---------------------------------------------------------------- */
.map-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 22px;
  margin: 12px 0 0;
  padding: 0;
  list-style: none;
  font-family: var(--face-data, 'Roboto Mono', monospace);
  font-size: 11.5px;
  color: var(--map-ink-2);
}

.map-legend li {
  display: flex;
  align-items: center;
  gap: 7px;
}

.map-legend__mark {
  display: inline-block;
  width: 11px;
  height: 11px;
  flex: none;
}

.map-legend__mark--go {
  border-radius: 50%;
  background: var(--map-go);
}

.map-legend__mark--hold {
  background: var(--map-hold);
}

.map-legend__mark--nogo {
  border-radius: 50%;
  background: var(--map-nogo);
}

.map-legend__mark--route {
  height: 2px;
  background: var(--map-ink-2);
  opacity: 0.5;
}

.map-caption {
  margin: 10px 0 0;
  max-width: 74ch;
  font-size: 13.5px;
  line-height: 1.5;
  color: var(--map-ink-3);
}

/* --- Narrow screens -------------------------------------------------------------- */
@media (max-width: 900px) {
  .map-body {
    grid-template-columns: 1fr;
  }

  .map-stage {
    height: 56vh;
    min-height: 340px;
  }

  .map-readout__name {
    font-size: 19px;
  }
}

@media (max-width: 640px) {
  .map-figure {
    margin: 20px 0 28px;
  }

  .map-toolbar {
    gap: 10px 18px;
  }

  .map-slider {
    min-width: 140px;
    flex: 1 1 140px;
  }

  .map-legend {
    font-size: 10.5px;
    gap: 6px 14px;
  }
}

/* --- Print ------------------------------------------------------------------------ */
@media print {
  /* The toolbar, the zoom control and the callout are the reader's tools, not
     the figure's: they have no meaning on paper. The names and the scale bar
     do, and they are laid out by the client at the printed size. */
  .map-toolbar,
  .map-zoom,
  .map-callout {
    display: none !important;
  }

  .map-stage {
    height: 380px;
    break-inside: avoid;
  }

  .map-body {
    grid-template-columns: minmax(0, 1fr) 260px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .map-place__body {
    transition: none;
  }
}

a survey; the coastline and the road spines are OpenStreetMap at the corpus's own resolution. Zone A's household base is modelled (tier C) while Zone B's is derived (tier B).</p></figure><script>// The Locality Map — client layer.
//
// The map is drawn once, from the corpus, and this layer moves it: it zooms
// and pans the sheet, merges the marks that overlap into counted clusters,
// lifts a mark under the pointer and reads its numbers, and reads the four
// sliders. Every number it shows comes out of the mark's own data
// attributes, which the build wrote from the research corpus.


(function () {
// The Locality Map — label layout.
//
// A place's name is engraved beside its mark, but only where the name has
// room: a label that lies across another mark reads as a smudge and hides the
// very thing it names. So every name is offered four places to sit — right of
// the mark, left of it, above it, below it — and takes the first that is clear
// of every other mark, every other name, and the edge of the sheet.
//
// The names are laid out in order of the revenue they stand for, so when two
// of them want the same ground the bigger one keeps it.
//
// This is one implementation, used by the client layer, which re-lays the
// names out whenever the reader zooms, and by the print twin, which has no
// reader but is laid out by the same code in the browser that prints it.

// The places a name can sit, in the order they are tried. Right of the mark
// first, because that is where the eye looks.
const SPOTS = [
  { dx: 9, dy: 0, anchor: 'start' },
  { dx: -9, dy: 0, anchor: 'end' },
  { dx: 0, dy: -12, anchor: 'middle' },
  { dx: 0, dy: 17, anchor: 'middle' },
];

const hits = (box, other) =>
  box.left < other.right && box.right > other.left && box.top < other.bottom && box.bottom > other.top;

/**
 * Lays the names out.
 *
 * candidates: [{ id, x, y, text, revenue }] — where each mark is, in the same
 *   units as the obstacles and the sheet.
 * obstacles: [{ id, left, right, top, bottom }] — the things a name must not cross.
 * measure: (text) => width — how wide a name will be drawn.
 * sheet: { width, height } — the frame the names must stay inside.
 *
 * Returns a Map of id -> { dx, dy, anchor } for the names that were placed.
 */
function layoutLabels({ candidates, obstacles, measure, sheet }) {
  const placed = new Map();
  const taken = [];

  const ordered = [...candidates].sort((a, b) => (b.revenue || 0) - (a.revenue || 0));

  for (const candidate of ordered) {
    const width = measure(candidate.text);
    const sx = candidate.x;
    const sy = candidate.y;
    let chosen = null;

    for (const spot of SPOTS) {
      const left =
        spot.anchor === 'start'
          ? sx + spot.dx
          : spot.anchor === 'end'
            ? sx + spot.dx - width
              : sx + spot.dx - width / 2;
      // The baseline sits 4px below the spot; the name stands about 9px
      // above its baseline and hangs 3px below it.
      const baseline = sy + spot.dy + 4;
      const box = { left, right: left + width, top: baseline - 9, bottom: baseline + 3 };

      // A name that runs off the edge of the sheet is a broken word.
      if (box.left < 4 || box.right > sheet.width - 6) continue;
      // The name must not cross another mark, and must not lie over a name.
      if (obstacles.some((o) => o.id !== candidate.id && hits(box, o))) continue;
      if (taken.some((p) => hits(box, p))) continue;

      chosen = { spot, box };
      break;
    }

    if (!chosen) continue;
    placed.set(candidate.id, chosen.spot);
    taken.push(chosen.box);
  }

  return placed;
}

/**
 * The marks of a map, as obstacles for the names: every mark that stands on
 * its own is a thing a name must not cross.
 */
function markObstacles(marks) {
  return marks
    .filter((m) => !m.clustered)
    .map((m) => ({
      left: m.x - 11,
      right: m.x + 11,
      top: m.y - 11,
      bottom: m.y + 11,
      id: m.id,
    }));
}

/**
 * A cluster disc, as an obstacle: a name over a count hides the count.
 */
function clusterObstacle(disc) {
  return {
    left: disc.x - disc.radius - 2,
    right: disc.x + disc.radius + 2,
    top: disc.y - disc.radius - 2,
    bottom: disc.y + disc.radius + 2,
    id: `cluster:${disc.id}`,
  };
}

  const clusterLayer = figure.querySelector('.map-clusters');
  let clusterDiscs = [];

  const readout = figure.querySelector('[data-readout]');
  const countEl = figure.querySelector('[data-map-count]');
  const zoomButtons = [...figure.querySelectorAll('[data-zoom]')];
  const sliders = [...figure.querySelectorAll('[data-slider]')];
  const sliderValues = [...figure.querySelectorAll('[data-slider-value]')];
  // The board is the site's own instrument, and the page prints it after the

  const readView = (name) => {
    const raw = svg.getAttribute(name);

    return { x: box[0], y: box[1], w: box[2], h: box[3] };
  };
  const full = readView('data-view-full') || (() => {
    const box = svg.getAttribute('viewBox').split(/[\s,]+/).map(Number);
    return { x: box[0], y: box[1], w: box[2], h: box[3] };
  })();
  const home = readView('data-view-band') || full;
  let view = { ...home };

  const ZOOM_MIN = 0.9;
  const ZOOM_MAX = 26;
  const CLUSTER_RADIUS = 22; // screen pixels

  const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

  // The stage's pixel size, and the map metres in one screen pixel.
  const stageSize = () => {
    const rect = stage.getBoundingClientRect();
    return { w: rect.width || 1, h: rect.height || 1 };
  };

  // so no place in the corridor is cropped off the edge of the frame the
  // reader opens on: every one of them has to be reachable without zooming.
  function fitHome() {
    return fitTo(home, 'contain');

  // this fits its width and takes the height the panel's shape asks for. The
  // reader sees the whole spread at once and zooms into the part that

  function fitAll() {
    const size = stageSize();
    const w = full.w;
    const h = (w * size.h) / size.w;
    return {
      x: full.x + (full.w - w) / 2,
      y: full.y + (full.h - h) / 2,
      w,
      h,
    };
  }

  // panel and lets the excess fall off the edges.
  function fitTo(extent, mode) {
    const size = stageSize();
    const scale =

        ? Math.max(size.w / extent.w, size.h / extent.h)
        : Math.min(size.w / extent.w, size.h / extent.h);
    const w = size.w / scale;
    const h = size.h / scale;
    return {
      x: extent.x + (extent.w - w) / 2,
      y: extent.y + (extent.h - h) / 2,
      w,
      h,
    };
  }

  // --- The marks -----------------------------------------------------------
  const marks = places.map((el) => ({

    id: el.getAttribute('data-place-id'),
    x: Number(el.getAttribute('data-place-x')),
    y: Number(el.getAttribute('data-place-y')),
    zone: el.getAttribute('data-zone'),
    tier: el.getAttribute('data-tier'),
    cluster: el.getAttribute('data-cluster'),
    verdict: el.getAttribute('data-verdict'),
    name: el.getAttribute('data-name'),
    ward: el.getAttribute('data-ward'),
    cases: Number(el.getAttribute('data-cases')),
    price: Number(el.getAttribute('data-price')),
    margin: Number(el.getAttribute('data-margin')),
    saturation: Number(el.getAttribute('data-saturation')),
    travelMin: Number(el.getAttribute('data-travel-min')),
    revenue: Number(el.getAttribute('data-revenue') || 0),
    screenX: 0,
    screenY: 0,

  const markById = new Map(marks.map((m) => [m.id, m]));

  // --- The scale bar --------------------------------------------------------
  // The bar is drawn in the screen's own space, so its length has to follow

  const scaleBar = figure.querySelector('[data-map-scale-bar]');
  const scaleLabel = figure.querySelector('[data-map-scale-label]');

  function renderScaleBar(unitsPerPx) {
    if (!scaleBar) return;
    const metres = 1000;
    const pixels = metres / unitsPerPx;
    // A bar that is too long to sit in the panel is shortened to a round
    // number of kilometres that still fits.
    const choices = [1000, 2000, 5000, 10000, 20000];
    let best = choices[0];
    for (const choice of choices) {
      if (choice / unitsPerPx <= 130) best = choice;
    }

  function renderClusters(size) {

    const taken = new Set();

    for (const mark of marks) {
      if (taken.has(mark.id)) continue;
      if (mark.screenX < -40 || mark.screenX > size.w + 40 || mark.screenY < -40 || mark.screenY > size.h + 40) {
        taken.add(mark.id);
        continue;
      }
      const group = [mark];
      taken.add(mark.id);
      for (const other of marks) {
        if (taken.has(other.id)) continue;
        const dx = other.screenX - mark.screenX;
        const dy = other.screenY - mark.screenY;
        if (Math.hypot(dx, dy) <= CLUSTER_RADIUS) {
          group.push(other);
          taken.add(other.id);
        }
      }
      placed.push(group);
    }

    clusters = placed.filter((group) => group.length > 1);

    // The discs the client draws, kept so the label layout knows where they
    // are: a name must not lie across a cluster any more than it may lie
    // across a mark.
    clusterDiscs = clusters.map((group) => {
      const cx = group.reduce((sum, m) => sum + m.x, 0) / group.length;
      const cy = group.reduce((sum, m) => sum + m.y, 0) / group.length;
      const count = group.length;
      return {
        cx,
        cy,
        radius: 9 + Math.min(7, Math.log2(count) * 2.6),
        members: group.map((m) => m.id),
      };
    });

    for (const mark of marks) {
      const inCluster = clusters.some((group) => group.length > 1 && group.includes(mark));
      mark.el.classList.toggle('is-clustered', inCluster);
      mark.el.setAttribute('aria-hidden', inCluster ? 'true' : 'false');
      mark.el.tabIndex = inCluster ? -1 : 0;
    }

    const unitsPerPx = view.w / size.w;
    clusterLayer.innerHTML = clusters
      .map((group) => {
        const cx = group.reduce((sum, m) => sum + m.x, 0) / group.length;
        const cy = group.reduce((sum, m) => sum + m.y, 0) / group.length;
        const count = group.length;
        const radius = 9 + Math.min(7, Math.log2(count) * 2.6);
        const verdicts = new Set(group.map((m) => m.verdict));
        const tone = verdicts.size === 1 ? `map-cluster--${group[0].verdict.toLowerCase().replace('-', '')}` : '';
        const label = group
          .map((m) => `${m.name} (${m.id}), ${m.verdict}, ${Math.round(m.cases)} cases a month`)
          .join('. ');
        return (
          `<g class="map-cluster ${tone}" data-cluster-count="${count}" data-cluster-members="${group.map((m) => m.id).join(' ')}" ` +
          `transform="translate(${cx.toFixed(2)} ${cy.toFixed(2)}) scale(${unitsPerPx.toFixed(6)})" tabindex="0" role="button" ` +
          `aria-label="${count} places here: ${label.replace(/"/g, '&quot;')}">` +
          `<circle class="map-cluster__disc" r="${radius.toFixed(1)}"/>` +
          `<text class="map-cluster__count" y="4">${count}</text>` +
          `</g>`
        );
      })
      .join('');
  }

  // The width of a name, measured rather than guessed. The names are set in
  // the site's own face at twelve pixels, and a name measured by characters
  // rather than by the font is either too long (names that nearly touch) or
  // too short (names that cross a mark they were told to clear).
  const labelWidths = new Map();
  let labelCanvas = null;
  // The face the names are set in, read off one of them.
  const labelEl = svg.querySelector('.map-label text');
  function measureLabel(text) {
    const key = text || '';
    if (labelWidths.has(key)) return labelWidths.get(key);
    let width = key.length * 6.1;
    try {
      if (!labelCanvas) labelCanvas = document.createElement('canvas').getContext('2d');
      const style = getComputedStyle(labelEl);
      labelCanvas.font = `${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
      width = labelCanvas.measureText(key).width;
    } catch {
      /* the canvas could not be made; the estimate stands */
    }
    labelWidths.set(key, width);
    return width;
  }

  // A name is engraved on the map only when its mark stands on its own, and
  // only where the name has room: a label that would lie across another mark
  // reads as a smudge and hides the very thing it names.
  //
  // Every place has a name ready. Which names are drawn depends on the frame:
  // the places are laid out in order of the revenue they stand for, and each
  // one takes the first of four positions beside its mark that is clear of
  // every other mark and every name already placed.
  function renderLabels() {
    const size = stageSize();

    const candidates = [];
    const unitsPerPx = view.w / size.w;
    for (const group of svg.querySelectorAll('.map-label')) {
      const id = group.getAttribute('data-label-for');
      const mark = markById.get(id);
      const hidden = !mark || mark.el.classList.contains('is-clustered');
      group.toggleAttribute('hidden', hidden);
      if (hidden) continue;

      // The name is drawn in the screen's own size, so its group carries the
      // zoom factor the way the marks do.
      group.setAttribute(
        'transform',
        `translate(${mark.x.toFixed(2)} ${mark.y.toFixed(2)}) scale(${unitsPerPx.toFixed(6)})`
      );
      candidates.push({ group, mark, text: group.querySelector('text') });
    }

    // Every mark that is standing on its own is a thing a label must not cross,
    // and so is every cluster disc: a name over a count hides the count.
    const obstacles = markObstacles(
      marks.map((m) => ({
        id: m.id,
        x: m.screenX,
        y: m.screenY,
        clustered: m.el.classList.contains('is-clustered'),
      }))
    );

    for (const disc of clusterDiscs) {
      const sx = ((disc.cx - view.x) / view.w) * size.w;
      const sy = ((disc.cy - view.y) / view.h) * size.h;
      obstacles.push(clusterObstacle({ id: disc.members.join(','), x: sx, y: sy, radius: disc.radius }));
    }

    // The furniture the names must keep clear of: the zoom control on the
    // right and the scale bar on the left.
    const stageRect = stage.getBoundingClientRect();
    for (const el of [...zoomButtons, scaleBar]) {
      if (!el) continue;
      const r = el.getBoundingClientRect();
      obstacles.push({
        left: r.left - stageRect.left - 4,
        right: r.right - stageRect.left + 4,
        top: r.top - stageRect.top - 4,
        bottom: r.bottom - stageRect.top + 4,
        id: `furniture:${el.getAttribute('data-zoom') || 'scale'}`,
      });
    }

    // Every place has a name ready. Which names are drawn depends on the frame:
    // the names are laid out by the room they have and the revenue they stand
    // for, and the ones with no room are dropped.
    const placed = layoutLabels({
      candidates: candidates.map((c) => ({
        id: c.mark.id,
        x: c.mark.screenX,
        y: c.mark.screenY,
        text: c.text.textContent || '',
        revenue: c.mark.revenue,
      })),
      obstacles,
      measure: (text) => measureLabel(text),
      sheet: { width: size.w, height: size.h },
    });

    for (const candidate of candidates) {
      const { group, mark, text } = candidate;
      const spot = placed.get(mark.id);
      if (!spot) {
        group.setAttribute('hidden', '');
        continue;
      }
      text.setAttribute('x', String(spot.dx));
      text.setAttribute('y', String(spot.dy + 4));
      text.setAttribute('text-anchor', spot.anchor);
    }
  }

  // --- The readout ---------------------------------------------------------
  const fields = {};
  for (const el of readout ? readout.querySelectorAll('[data-readout-field]') : []) {
    fields[el.getAttribute('data-readout-field')] = el;
  }

  function fillReadout(mark) {
    if (!readout || !mark) return;
    const put = (field, value) => {
      if (fields[field]) fields[field].textContent = value;
    };
    put('id', mark.id);
    put('name', mark.name);
    put('ward', mark.ward || '—');
    put('cases', `${Math.round(mark.cases)} a month`);
    put('price', `Rs ${mark.price.toLocaleString('en-IN')}`);
    put('margin', `Rs ${mark.margin.toLocaleString('en-IN')}`);
    put('saturation', `${mark.saturation} / 100`);
    put('travel', `${mark.travelMin} min`);
    put('verdict', mark.verdict);
    put('cluster', mark.cluster);
    readout.dataset.verdict = mark.verdict;
    readout.hidden = false;
  }

  function reasonFor(mark) {
    const el = fields.reason;
    if (!el) return;
    el.textContent =
      mark.verdict === 'GO'
        ? `${mark.cases.toFixed(0)} cases a month, blended price Rs ${mark.price.toLocaleString('en-IN')} against Rs 850 a clustered visit, saturation ${mark.saturation}.`
        : mark.verdict === 'HOLD'
          ? `Holds on volume or margin: ${mark.cases.toFixed(0)} cases a month, Rs ${mark.margin.toLocaleString('en-IN')} a visit over cost, saturation ${mark.saturation}.`
          : `Not worth a stop: ${mark.cases.toFixed(0)} cases a month, Rs ${mark.margin.toLocaleString('en-IN')} a visit over cost.`;
  }

  // --- The callout ---------------------------------------------------------
  function showCallout(mark) {
    if (!callout || !mark) return;
    callout.innerHTML =
      `<span class="map-callout__name">${mark.name}</span>` +
      `<span class="map-callout__figures">${Math.round(mark.cases)} cases a month &middot; Rs ${mark.margin.toLocaleString('en-IN')} margin &middot; ${mark.verdict}</span>`;
    callout.hidden = false;
    const size = stageSize();
    const flip = mark.screenX > size.w - 210;
    callout.classList.toggle('map-callout--flip', flip);
    callout.style.left = `${Math.round(mark.screenX + (flip ? -14 : 14))}px`;
    callout.style.top = `${Math.round(mark.screenY - 18)}px`;
  }

  function hideCallout() {
    if (callout) callout.hidden = true;
  }

  // --- Hover, focus, selection ---------------------------------------------
  function lift(mark, on) {
    if (!mark) return;
    mark.el.classList.toggle('is-lifted', on);
  }

  function show(mark) {
    if (hovered && hovered !== mark) lift(hovered, false);
    hovered = mark;
    if (mark) {
      lift(mark, true);
      showCallout(mark);
      fillReadout(mark);
      reasonFor(mark);
      highlightRoute(mark.cluster);
    } else {
      hideCallout();
      if (selected) fillReadout(selected);
      highlightRoute(selected ? selected.cluster : null);
    }
  }

  // The route a place sits on is the one worth drawing: the other fourteen
  // stay as faint threads until the reader asks for them.
  function highlightRoute(clusterId) {
    for (const path of svg.querySelectorAll('.map-route')) {
      path.classList.toggle('is-active', Boolean(clusterId) && path.getAttribute('data-route') === clusterId);
    }
  }

  function select(mark, writeUrl = true) {
    selected = mark;
    for (const m of marks) {
      const is = m === mark;
      m.el.setAttribute('aria-selected', is ? 'true' : 'false');
      m.el.classList.toggle('is-selected', is);
    }
    if (mark) {
      fillReadout(mark);
      reasonFor(mark);
    }
    if (writeUrl && mark) {
      const url = new URL(window.location.href);
      url.searchParams.set('place', mark.id);
      window.history.replaceState({}, '', url);
    }
  }

  for (const mark of marks) {
    const el = mark.el;
    el.addEventListener('pointerenter', () => show(mark));
    el.addEventListener('pointerleave', () => show(null));
    el.addEventListener('focus', () => show(mark));
    el.addEventListener('blur', () => show(null));
    el.addEventListener('click', (event) => {
      event.stopPropagation();
      select(mark);
      show(mark);
    });
    el.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        select(mark);
        show(mark);
        return;
      }
      if (event.key === 'ArrowRight' || event.key === 'ArrowDown' || event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
        // Arrows walk the route the place actually sits on.
        const same = marks.filter((m) => m.cluster === mark.cluster && !m.el.classList.contains('is-clustered'));
        const index = same.indexOf(mark);
        if (index === -1 || same.length < 2) return;
        const step = event.key === 'ArrowRight' || event.key === 'ArrowDown' ? 1 : -1;
        const next = same[(index + step + same.length) % same.length];
        event.preventDefault();
        next.el.focus();
        show(next);
        return;
      }
      if (event.key === 'Escape') {
        select(null, false);
        show(null);
      }
    });
  }

  // A cluster zooms in until its places come apart.
  clusterLayer.addEventListener('click', (event) => {
    const group = event.target.closest('.map-cluster');
    if (!group) return;
    const members = (group.getAttribute('data-cluster-members') || '').split(' ').map((id) => markById.get(id)).filter(Boolean);
    if (!members.length) return;
    const cx = members.reduce((sum, m) => sum + m.x, 0) / members.length;
    const cy = members.reduce((sum, m) => sum + m.y, 0) / members.length;
    zoomBy(2.2, { x: cx, y: cy });
  });
  clusterLayer.addEventListener('keydown', (event) => {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    const group = event.target.closest('.map-cluster');
    if (!group) return;
    event.preventDefault();
    group.dispatchEvent(new MouseEvent('click', { bubbles: true }));
  });

  // --- Zoom and pan --------------------------------------------------------
  function setView(next) {
    view = next;
    render();
  }

  function zoomBy(factor, focus) {
    const size = stageSize();
    const centre = focus || {
      x: view.x + view.w / 2,
      y: view.y + view.h / 2,
    };
    const nextW = clamp(view.w / factor, full.w / ZOOM_MAX, full.w / ZOOM_MIN);
    const nextH = nextW * (view.h / view.w);
    const ratio = (centre.x - view.x) / view.w;
    const ratioY = (centre.y - view.y) / view.h;
    setView({
      x: centre.x - nextW * ratio,
      y: centre.y - nextH * ratioY,
      w: nextW,
      h: nextH,
    });
  }

  function centreOn(mark, scale) {
    const w = clamp(scale, full.w / ZOOM_MAX, full.w);
    const h = w * (view.h / view.w);
    setView({ x: mark.x - w / 2, y: mark.y - h / 2, w, h });
  }

  for (const button of zoomButtons) {
    button.addEventListener('click', () => {
      const what = button.getAttribute('data-zoom');
      if (what === 'in') zoomBy(1.6);
      else if (what === 'out') zoomBy(1 / 1.6);
      else if (what === 'all') setView(fitAll());
      else setView(fitHome());
    });
  }

  svg.addEventListener(
    'wheel',
    (event) => {
      event.preventDefault();
      const rect = stage.getBoundingClientRect();
      const fx = (event.clientX - rect.left) / rect.width;
      const fy = (event.clientY - rect.top) / rect.height;
      zoomBy(event.deltaY < 0 ? 1.18 : 1 / 1.18, {
        x: view.x + view.w * fx,
        y: view.y + view.h * fy,
      });
    },
    { passive: false }
  );

  // Drag to pan. A drag that starts on a mark is a press, not a pan, and a
  // drag that starts on the zoom control is a click the control must keep.
  let dragging = null;
  stage.addEventListener('pointerdown', (event) => {
    if (event.target.closest('.map-place, .map-zoom, button')) return;
    dragging = { x: event.clientX, y: event.clientY, vx: view.x, vy: view.y };
    stage.setPointerCapture(event.pointerId);
    stage.classList.add('is-panning');
  });
  stage.addEventListener('pointermove', (event) => {
    if (!dragging) return;
    const size = stageSize();
    const dx = ((event.clientX - dragging.x) / size.w) * view.w;
    const dy = ((event.clientY - dragging.y) / size.h) * view.h;
    setView({ ...view, x: dragging.vx - dx, y: dragging.vy - dy });
  });
  const endDrag = () => {
    dragging = null;
    stage.classList.remove('is-panning');
  };
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);
  stage.addEventListener('click', (event) => {
    if (event.target.closest('.map-place, .map-cluster')) return;
    select(null, false);
  });

  // --- The sliders ---------------------------------------------------------
  const sliderState = () => {
    const state = {};
    for (const slider of sliders) {
      state[slider.getAttribute('data-slider')] = {
        min: Number(slider.min),
        max: Number(slider.max),
        value: Number(slider.value),
      };
    }
    return state;
  };

  function applyFilters() {
    const state = sliderState();
    const board = getBoard();
    const zone = board ? (board.querySelector('select[data-filter="zone"]') || {}).value || '' : '';
    const verdict = board ? (board.querySelector('select[data-filter="verdict"]') || {}).value || '' : '';
    const tier = board ? (board.querySelector('select[data-filter="tier"]') || {}).value || '' : '';

    let shown = 0;
    for (const mark of marks) {
      let ok = true;
      if (state.cases && mark.cases < state.cases.value) ok = false;
      if (state.price && mark.price < state.price.value) ok = false;
      if (state.margin && mark.margin < state.margin.value) ok = false;
      if (state.saturation && mark.saturation > state.saturation.value) ok = false;
      if (zone && mark.zone !== zone) ok = false;
      if (verdict && mark.verdict !== verdict) ok = false;
      if (tier && mark.tier !== tier) ok = false;
      mark.el.classList.toggle('is-dimmed', !ok);
      if (ok) shown += 1;
      if (mark.el.hasAttribute('data-dimmed') && ok) mark.el.removeAttribute('data-dimmed');
      if (!ok) mark.el.setAttribute('data-dimmed', '');
    }

    for (const el of sliderValues) {
      const key = el.getAttribute('data-slider-value');
      const s = state[key];
      if (!s) continue;
      const unit = key === 'price' || key === 'margin' ? 'Rs ' : '';
      el.textContent =
        key === 'saturation' ? `under ${s.value}` : `${unit}${s.value.toLocaleString('en-IN')}+`;
    }
    if (countEl) countEl.textContent = `${shown} of ${marks.length} places match`;
    return shown;
  }

  for (const slider of sliders) {
    slider.addEventListener('input', () => {
      applyFilters();
    });
    slider.addEventListener('change', () => {
      applyFilters();
    });
  }

  // --- The board ------------------------------------------------------------
  // The board is printed further down the page than the figure, so its
  // controls are not in the document yet. The map listens on the document
  // itself: a change on a filter or a click on a gate both bubble up, and the
  // map answers whichever one it hears.
  function syncWithBoard(event) {
    const target = event.target;
    if (target && target.matches && target.matches('select[data-filter]')) {
      applyFilters();
      return;
    }
    if (target && target.closest && target.closest('#board .gate')) {
      applyFilters();
    }
  }
  document.addEventListener('change', syncWithBoard);
  document.addEventListener('click', syncWithBoard);

  // --- Keyboard on the map ---------------------------------------------------
  svg.addEventListener('keydown', (event) => {
    if (event.key === '+' || event.key === '=') {
      event.preventDefault();
      zoomBy(1.6);
    } else if (event.key === '-' || event.key === '_') {
      event.preventDefault();
      zoomBy(1 / 1.6);
    } else if (event.key === '0') {
      event.preventDefault();
      setView(fitHome());
    }
  });

  // --- Start -----------------------------------------------------------------
  setView(fitHome());
  applyFilters();

  const requested = new URL(window.location.href).searchParams.get('place');
  if (requested) {
    const mark = markById.get(requested);
    if (mark) {
      select(mark, false);
      centreOn(mark, fitHome().w / 6);
      show(mark);
    }
  }

  window.addEventListener('resize', () => render());

  // The panel's own size can change without the window changing: the print
  // twin is laid out at the printed size, and the site may reflow the figure
  // into a narrower column. A resize observer catches both, and the map
  // re-lays its names out at the size it actually has.
  if ('ResizeObserver' in window) {
    let lastW = 0;
    let lastH = 0;
    const observer = new ResizeObserver(() => {
      const size = stageSize();
      if (size.w === lastW && size.h === lastH) return;
      lastW = size.w;
      lastH = size.h;
      render();
    });
    observer.observe(stage);
  }
})();
</script></body></html>
